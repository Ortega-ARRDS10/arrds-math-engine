<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arrds Math Engine · Panel de pruebas</title>
<style>
  /* Estética Arrds (propuesta "Ruido Cero"): negro puro, texto blanco, acento cian.
     Sin fuentes remotas: se usan Inter / JetBrains Mono si están instaladas. */
  :root {
    --bg: #000000; --panel: #0a0a0a; --line: #1f1f1f; --line2: #2c2c2c;
    --fg: #f2f2f2; --dim: #8a8a8a; --accent: #00e5ff; --accent-dim: #00e5ff22;
    --ok: #22c55e; --warn: #eab308; --bad: #ef4444;
    --ui: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "JetBrains Mono", "Cascadia Mono", Consolas, "SFMono-Regular", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--ui); }
  button, input, select, textarea { font: inherit; color: inherit; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  .brand { font-weight: 600; letter-spacing: .02em; }
  .brand b { color: var(--accent); font-weight: 600; }
  .tabs { display: flex; gap: 4px; margin-left: 12px; }
  .tab { background: none; border: 1px solid transparent; padding: 5px 12px; border-radius: 6px; cursor: pointer; color: var(--dim); }
  .tab.active { color: var(--fg); border-color: var(--line2); background: var(--panel); }
  .spacer { flex: 1; }
  .integrity { display: flex; align-items: center; gap: 8px; font: 12px var(--mono); color: var(--dim); cursor: pointer; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 8px var(--warn); }
  .dot.ok { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .dot.bad { background: var(--bad); box-shadow: 0 0 8px var(--bad); }
  kbd { font: 11px var(--mono); border: 1px solid var(--line2); border-radius: 4px; padding: 1px 5px; color: var(--dim); }
  main { display: flex; height: calc(100% - 49px); }
  nav { width: 270px; flex: none; border-right: 1px solid var(--line); overflow-y: auto; padding: 10px 0; }
  nav input { width: calc(100% - 20px); margin: 0 10px 8px; background: var(--panel); border: 1px solid var(--line2); border-radius: 6px; padding: 6px 8px; }
  nav h4 { margin: 12px 14px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); font-weight: 500; }
  nav a { display: block; padding: 3px 14px 3px 22px; color: var(--fg); text-decoration: none; font: 12.5px var(--mono); cursor: pointer; border-left: 2px solid transparent; }
  nav a:hover { background: var(--panel); }
  nav a.active { border-left-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
  section.view { flex: 1; overflow-y: auto; padding: 18px 24px; display: none; }
  section.view.active { display: block; }
  h2 { margin: 0 0 4px; font: 600 18px var(--mono); color: var(--accent); }
  .desc { color: var(--dim); margin: 0 0 14px; }
  .params { font: 12px var(--mono); color: var(--dim); margin-bottom: 10px; }
  .params div span { color: var(--fg); }
  textarea { width: 100%; min-height: 150px; background: var(--panel); border: 1px solid var(--line2); border-radius: 6px; padding: 10px; font: 13px var(--mono); resize: vertical; }
  textarea:focus, input:focus, select:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
  .row { display: flex; gap: 10px; align-items: center; margin: 10px 0; flex-wrap: wrap; }
  .btn { background: var(--accent); color: #000; border: none; border-radius: 6px; padding: 6px 16px; font-weight: 600; cursor: pointer; }
  .btn.ghost { background: none; color: var(--fg); border: 1px solid var(--line2); font-weight: 400; }
  .status { font: 12px var(--mono); }
  .status .ok { color: var(--ok); } .status .bad { color: var(--bad); }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin: 12px 0; background: var(--panel); }
  .card h5 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); font-weight: 500; }
  pre { margin: 0; font: 12.5px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; }
  .hint { color: var(--warn); }
  .metrics { display: flex; gap: 22px; flex-wrap: wrap; font: 12.5px var(--mono); }
  .metrics span { color: var(--dim); }
  svg.plot { width: 100%; max-width: 860px; height: auto; display: block; }
  svg.plot text { fill: var(--dim); font: 11px var(--mono); }
  table { width: 100%; border-collapse: collapse; font: 12px var(--mono); }
  th { text-align: left; color: var(--dim); font-weight: 500; border-bottom: 1px solid var(--line2); padding: 6px; position: sticky; top: 0; background: var(--bg); }
  td { border-bottom: 1px solid var(--line); padding: 5px 6px; vertical-align: top; max-width: 280px; overflow-wrap: anywhere; }
  td.nw { white-space: nowrap; }
  td.pass { color: var(--ok); } td.fail { color: var(--bad); }
  tr.fail td { background: #ef444411; }
  select { background: var(--panel); border: 1px solid var(--line2); border-radius: 6px; padding: 5px 8px; }
  .summary { font: 13px var(--mono); }
  #cmd { position: fixed; inset: 0; background: #000c; display: none; align-items: flex-start; justify-content: center; padding-top: 14vh; z-index: 10; }
  #cmd.open { display: flex; }
  #cmd .box { width: min(680px, 92vw); background: var(--panel); border: 1px solid var(--accent); border-radius: 10px; box-shadow: 0 0 40px #00e5ff33; }
  #cmd input { width: 100%; background: none; border: none; border-bottom: 1px solid var(--line2); padding: 14px 16px; font: 16px var(--mono); outline: none; }
  #cmd .out { padding: 12px 16px; font: 13px var(--mono); min-height: 44px; }
  #cmd .help { padding: 0 16px 12px; color: var(--dim); font-size: 12px; }
  @media (max-width: 760px) { nav { display: none; } section.view { padding: 14px 16px; } }
</style>
</head>
<body>
<header>
  <div class="brand"><b>Arrds</b> Math Engine <span style="color:var(--dim);font-size:12px">· panel de pruebas</span></div>
  <div class="tabs">
    <button class="tab active" data-view="ops">Operaciones</button>
    <button class="tab" data-view="bench">Banco de pruebas</button>
  </div>
  <div class="spacer"></div>
  <span style="color:var(--dim);font-size:12px">Comando <kbd>Ctrl</kbd>+<kbd>K</kbd></span>
  <div class="integrity" id="integrity" title="Integridad según el banco de verificación">
    <div class="dot" id="integrity-dot"></div><span id="integrity-text">sin verificar</span>
  </div>
</header>
<main>
  <nav id="nav"><input id="filter" placeholder="Filtrar operaciones…" autocomplete="off"></nav>
  <section class="view active" id="view-ops">
    <h2 id="op-name">—</h2>
    <p class="desc" id="op-desc">Elegí una operación en la barra lateral.</p>
    <div class="params" id="op-params"></div>
    <textarea id="editor" spellcheck="false" aria-label="Parámetros JSON"></textarea>
    <div class="row">
      <button class="btn" id="run">Ejecutar</button>
      <button class="btn ghost" id="reset">Restaurar ejemplo</button>
      <button class="btn ghost" id="copy">Copiar respuesta JSON</button>
      <span style="color:var(--dim);font-size:12px"><kbd>Ctrl</kbd>+<kbd>Enter</kbd></span>
      <span class="status" id="status"></span>
    </div>
    <div id="output"></div>
  </section>
  <section class="view" id="view-bench">
    <div class="row">
      <button class="btn" id="bench-run">Ejecutar banco</button>
      <label>Módulo <select id="bench-module"><option value="">todos</option></select></label>
      <label><input type="checkbox" id="bench-only-fail"> solo fallas</label>
      <span class="summary" id="bench-summary"></span>
    </div>
    <table>
      <thead><tr><th></th><th>caso</th><th>esperado</th><th>obtenido</th><th>desviación</th><th>tol</th><th>ms</th><th>referencia</th></tr></thead>
      <tbody id="bench-body"></tbody>
    </table>
  </section>
</main>
<div id="cmd"><div class="box">
  <input id="cmd-input" placeholder="Expresión, p. ej.  sqrt(2)*sin(pi/4)" autocomplete="off" spellcheck="false">
  <div class="out" id="cmd-out"></div>
  <div class="help">Enter: evaluar · <b>plot</b> f(x) · <b>diff</b> f(x) · <b>&gt;</b>nombre: abrir operación · Esc: cerrar</div>
</div></div>

<script>
"use strict";
// Nada de eval ni innerHTML con datos: todo el DOM dinámico se construye
// con createElement/textContent. El JSON se interpreta con JSON.parse.

const $ = (id) => document.getElementById(id);
const state = { ops: [], modules: {}, current: null, lastResponse: null, bench: null };

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const c of children.flat()) if (c != null) node.append(c instanceof Node ? c : String(c));
  return node;
}

async function api(path, body) {
  const opts = body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  };
  const res = await fetch(path, opts);
  return res.json();
}

// --- formato ----------------------------------------------------------
function fmtNum(v) {
  if (typeof v !== "number") return String(v);
  if (Number.isInteger(v) && Math.abs(v) < 1e15) return String(v);
  const a = Math.abs(v);
  return (a !== 0 && (a < 1e-4 || a >= 1e10)) ? v.toExponential(6) : String(+v.toPrecision(12));
}
function sci(v) { return v === 0 ? "0" : Number(v).toExponential(1); }
function isComplex(v) { return v && typeof v === "object" && !Array.isArray(v) && Object.keys(v).length === 2 && "re" in v && "im" in v; }
function fmtValue(v) {
  if (isComplex(v)) {
    const im = typeof v.im === "number" ? v.im : NaN;
    return `${fmtNum(v.re)} ${im < 0 ? "−" : "+"} ${fmtNum(Math.abs(im))}j`;
  }
  return typeof v === "number" ? fmtNum(v) : typeof v === "string" ? v : JSON.stringify(v);
}
// JSON legible con listas largas recortadas (la respuesta completa se copia aparte).
function pretty(v, indent = "") {
  const next = indent + "  ";
  if (Array.isArray(v)) {
    if (v.length === 0) return "[]";
    const flat = v.every((x) => typeof x !== "object" || x === null || isComplex(x));
    const shown = v.length > 40 ? v.slice(0, 12) : v;
    const extra = v.length > 40 ? [`… (${v.length} elementos)`] : [];
    if (flat) return "[" + shown.map(fmtValue).concat(extra).join(", ") + "]";
    return "[\n" + shown.map((x) => next + pretty(x, next)).concat(extra.map((e) => next + e)).join(",\n") + "\n" + indent + "]";
  }
  if (v && typeof v === "object") {
    if (isComplex(v)) return fmtValue(v);
    const keys = Object.keys(v);
    if (!keys.length) return "{}";
    return "{\n" + keys.map((k) => `${next}${k}: ${pretty(v[k], next)}`).join(",\n") + "\n" + indent + "}";
  }
  return fmtValue(v);
}

// --- barra lateral ----------------------------------------------------
function buildNav() {
  const nav = $("nav"), filter = $("filter").value.trim().toLowerCase();
  nav.querySelectorAll("h4, a").forEach((n) => n.remove());
  for (const [mod, title] of Object.entries(state.modules)) {
    const ops = state.ops.filter((o) => o.module === mod && (!filter || o.name.includes(filter) || o.description.toLowerCase().includes(filter)));
    if (!ops.length) continue;
    nav.append(el("h4", {}, title));
    for (const op of ops) {
      nav.append(el("a", {
        class: state.current && state.current.name === op.name ? "active" : "",
        title: op.description, onclick: () => selectOp(op.name),
      }, op.name.split(".").slice(1).join(".")));
    }
  }
}

function selectOp(name) {
  const op = state.ops.find((o) => o.name === name);
  if (!op) return;
  state.current = op;
  $("op-name").textContent = op.name;
  $("op-desc").textContent = op.description;
  const params = $("op-params");
  params.replaceChildren(...Object.entries(op.params).map(([k, d]) => el("div", {}, el("span", {}, k), " — ", d)));
  $("editor").value = JSON.stringify(op.example, null, 2);
  $("output").replaceChildren();
  $("status").replaceChildren();
  showView("ops");
  buildNav();
  try { localStorage.setItem("arrds.op", name); } catch (_) { /* almacenamiento opcional */ }
}

// --- ejecución --------------------------------------------------------
async function runCurrent() {
  if (!state.current) return;
  let params;
  try { params = JSON.parse($("editor").value || "{}"); }
  catch (e) { $("status").replaceChildren(el("span", { class: "bad" }, "JSON inválido: " + e.message)); return; }
  $("status").textContent = "ejecutando…";
  let res;
  try { res = await api("/api/run", { operation: state.current.name, params }); }
  catch (e) { $("status").replaceChildren(el("span", { class: "bad" }, "sin conexión con el motor")); return; }
  state.lastResponse = res;
  renderResponse(res);
}

function renderResponse(res) {
  const out = $("output");
  out.replaceChildren();
  $("status").replaceChildren(
    res.ok ? el("span", { class: "ok" }, "✓ ok") : el("span", { class: "bad" }, "✗ " + res.error.code),
    `  ·  ${res.elapsed_ms} ms`);
  if (!res.ok) {
    out.append(el("div", { class: "card" }, el("h5", {}, "error " + res.error.code),
      el("pre", {}, res.error.message),
      res.error.hint ? el("pre", { class: "hint", style: "margin-top:8px" }, "Por qué: " + res.error.hint) : null));
    return;
  }
  const r = res.result;
  const obj = r && typeof r === "object" && !Array.isArray(r) ? r : null;
  if (obj && "converged" in obj && "error_estimate" in obj) {
    out.append(el("div", { class: "card" }, el("h5", {}, "resultado iterativo"),
      el("div", { class: "metrics" },
        el("div", {}, el("span", {}, "método "), obj.method),
        el("div", {}, el("span", {}, "convergió "), obj.converged ? "sí" : "no"),
        el("div", {}, el("span", {}, "iteraciones "), obj.iterations),
        el("div", {}, el("span", {}, "error estimado "), fmtValue(obj.error_estimate)))));
  }
  if (obj && (obj.latex !== undefined)) {
    const latex = Array.isArray(obj.latex) ? obj.latex.map((x) => Array.isArray(x) ? x.join("  &  ") : x).join("\n") : obj.latex;
    out.append(el("div", { class: "card" }, el("h5", {}, "LaTeX"), el("pre", {}, latex)));
  }
  if (obj && Array.isArray(obj.plots)) for (const p of obj.plots) out.append(el("div", { class: "card" }, el("h5", {}, p.title), drawPlot(p)));
  const shown = obj ? Object.fromEntries(Object.entries(obj).filter(([k]) => k !== "plots")) : r;
  out.append(el("div", { class: "card" }, el("h5", {}, "resultado"), el("pre", {}, pretty(shown))));
}

// --- gráfica SVG --------------------------------------------------------
const COLORS = ["#00e5ff", "#f2f2f2", "#eab308", "#e879f9", "#22c55e"];
function drawPlot(p) {
  const NS = "http://www.w3.org/2000/svg", W = 820, H = 300, m = { l: 64, r: 16, t: 12, b: 40 };
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("class", "plot");
  const add = (tag, attrs, text) => {
    const n = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
    if (text != null) n.textContent = text;
    svg.append(n); return n;
  };
  const tx = (x) => p.log_x ? Math.log10(x) : x;
  let xmin = Infinity, xmax = -Infinity, ymin = Infinity, ymax = -Infinity;
  for (const s of p.series) s.x.forEach((x, i) => {
    const y = s.y[i];
    if (typeof x !== "number" || typeof y !== "number" || (p.log_x && x <= 0)) return;
    xmin = Math.min(xmin, tx(x)); xmax = Math.max(xmax, tx(x)); ymin = Math.min(ymin, y); ymax = Math.max(ymax, y);
  });
  if (!isFinite(xmin) || !isFinite(ymin)) { add("text", { x: 20, y: 30 }, "sin datos graficables"); return svg; }
  if (xmax === xmin) { xmax += 1; xmin -= 1; }
  if (ymax === ymin) { ymax += 1; ymin -= 1; }
  const pad = (ymax - ymin) * 0.06; ymin -= pad; ymax += pad;
  const sx = (x) => m.l + (tx(x) - xmin) / (xmax - xmin) * (W - m.l - m.r);
  const sy = (y) => H - m.b - (y - ymin) / (ymax - ymin) * (H - m.t - m.b);
  add("rect", { x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b, fill: "none", stroke: "#2c2c2c" });
  for (let i = 0; i <= 5; i++) {
    const yv = ymin + (ymax - ymin) * i / 5, yp = sy(yv);
    add("line", { x1: m.l, x2: W - m.r, y1: yp, y2: yp, stroke: "#1a1a1a" });
    add("text", { x: m.l - 6, y: yp + 4, "text-anchor": "end" }, fmtNum(+yv.toPrecision(3)));
    const xv = xmin + (xmax - xmin) * i / 5, xp = m.l + (W - m.l - m.r) * i / 5;
    add("line", { x1: xp, x2: xp, y1: m.t, y2: H - m.b, stroke: "#1a1a1a" });
    add("text", { x: xp, y: H - m.b + 16, "text-anchor": "middle" }, fmtNum(+(p.log_x ? 10 ** xv : xv).toPrecision(3)));
  }
  if (ymin < 0 && ymax > 0) add("line", { x1: m.l, x2: W - m.r, y1: sy(0), y2: sy(0), stroke: "#3a3a3a" });
  add("text", { x: (W + m.l) / 2, y: H - 6, "text-anchor": "middle" }, p.x_label + (p.log_x ? " (log)" : ""));
  add("text", { x: 14, y: (H - m.b) / 2, "text-anchor": "middle", transform: `rotate(-90 14 ${(H - m.b) / 2})` }, p.y_label);
  p.series.forEach((s, k) => {
    const color = COLORS[k % COLORS.length];
    if (s.points) {
      s.x.forEach((x, i) => { if (typeof s.y[i] === "number") add("circle", { cx: sx(x), cy: sy(s.y[i]), r: 3, fill: color }); });
    } else {
      // Los puntos fuera de dominio (null) cortan la curva en tramos.
      let d = "", pen = false;
      s.x.forEach((x, i) => {
        const y = s.y[i];
        if (typeof y !== "number" || typeof x !== "number" || (p.log_x && x <= 0)) { pen = false; return; }
        d += `${pen ? "L" : "M"}${sx(x).toFixed(1)},${sy(y).toFixed(1)}`; pen = true;
      });
      add("path", { d, fill: "none", stroke: color, "stroke-width": 1.6 });
    }
    add("text", { x: W - m.r - 8, y: m.t + 16 + 14 * k, "text-anchor": "end", fill: color, style: `fill:${color}` }, s.name);
  });
  return svg;
}

// --- banco de pruebas + integridad -----------------------------------
function setIntegrity(kind, text) {
  $("integrity-dot").className = "dot" + (kind === "ok" ? " ok" : kind === "bad" ? " bad" : "");
  $("integrity-text").textContent = text;
}

async function runBench() {
  const module = $("bench-module").value || undefined;
  $("bench-summary").textContent = "ejecutando…";
  if (!module) setIntegrity("warn", "verificando…");
  let rep;
  try { rep = await api("/api/selftest", module ? { module } : {}); }
  catch (e) { setIntegrity("bad", "motor inaccesible"); $("bench-summary").textContent = "sin conexión"; return; }
  state.bench = rep;
  const ms = rep.cases.reduce((a, c) => a + c.elapsed_ms, 0).toFixed(1);
  $("bench-summary").textContent = `${rep.passed}/${rep.total} pasan · ${rep.failed} fallan · ${ms} ms`;
  if (!module) setIntegrity(rep.failed ? "bad" : "ok", rep.failed ? `${rep.failed} falla(s)` : `íntegro ${rep.passed}/${rep.total}`);
  renderBench();
}

function renderBench() {
  if (!state.bench) return;
  const onlyFail = $("bench-only-fail").checked;
  const rows = state.bench.cases.filter((c) => !onlyFail || !c.passed).map((c) => el("tr", { class: c.passed ? "" : "fail" },
    el("td", { class: "nw " + (c.passed ? "pass" : "fail") }, c.passed ? "PASA" : "FALLA"),
    el("td", { class: "nw", title: c.operation }, c.id),
    el("td", {}, pretty(c.expected)),
    el("td", {}, pretty(c.got), c.note ? el("div", { class: "hint" }, c.note) : null),
    el("td", { class: "nw" }, c.deviation == null ? "—" : sci(c.deviation)),
    el("td", { class: "nw" }, c.tol == null ? "—" : sci(c.tol)),
    el("td", { class: "nw" }, Number(c.elapsed_ms).toFixed(2)),
    el("td", { style: "color:var(--dim)" }, c.reference)));
  $("bench-body").replaceChildren(...rows);
}

// --- barra de comandos (Ctrl+K) ---------------------------------------
function openCmd() { $("cmd").classList.add("open"); $("cmd-input").focus(); $("cmd-input").select(); }
function closeCmd() { $("cmd").classList.remove("open"); }

async function runCmd() {
  const text = $("cmd-input").value.trim(), out = $("cmd-out");
  if (!text) return;
  if (text.startsWith(">")) {
    const q = text.slice(1).trim().toLowerCase();
    const op = state.ops.find((o) => o.name === q) || state.ops.find((o) => o.name.includes(q));
    if (op) { closeCmd(); selectOp(op.name); } else out.textContent = "No hay operaciones que coincidan";
    return;
  }
  let res;
  if (/^plot\s+/i.test(text)) {
    const expression = text.replace(/^plot\s+/i, "");
    closeCmd();
    selectOp("expr.sample");
    $("editor").value = JSON.stringify({ expression, var: "x", a: -10, b: 10, n: 400 }, null, 2);
    return runCurrent();
  }
  if (/^diff\s+/i.test(text)) {
    res = await api("/api/run", { operation: "expr.derivative", params: { expression: text.replace(/^diff\s+/i, ""), var: "x" } });
    out.replaceChildren(res.ok ? `d/dx = ${res.result.expression}` : errLine(res));
    return;
  }
  res = await api("/api/run", { operation: "expr.evaluate", params: { expression: text, complex_mode: /\bj\b|\dj\b/.test(text) } });
  out.replaceChildren(res.ok ? el("span", { style: "color:var(--accent)" }, "= " + fmtValue(res.result.value)) : errLine(res),
    el("span", { style: "color:var(--dim)" }, `   ${res.elapsed_ms} ms`));
}
function errLine(res) {
  return el("span", { style: "color:var(--bad)" }, `${res.error.code}: ${res.error.message}`);
}

// --- navegación y atajos ----------------------------------------------
function showView(v) {
  document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("active", t.dataset.view === v));
  $("view-ops").classList.toggle("active", v === "ops");
  $("view-bench").classList.toggle("active", v === "bench");
}
document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => showView(t.dataset.view)));
$("integrity").addEventListener("click", () => { showView("bench"); });
$("filter").addEventListener("input", buildNav);
$("run").addEventListener("click", runCurrent);
$("reset").addEventListener("click", () => state.current && selectOp(state.current.name));
$("copy").addEventListener("click", () => {
  if (state.lastResponse) navigator.clipboard.writeText(JSON.stringify(state.lastResponse, null, 2)).catch(() => {});
});
$("bench-run").addEventListener("click", runBench);
$("bench-only-fail").addEventListener("change", renderBench);
$("cmd").addEventListener("click", (e) => { if (e.target.id === "cmd") closeCmd(); });
$("cmd-input").addEventListener("keydown", (e) => { if (e.key === "Enter") runCmd(); if (e.key === "Escape") closeCmd(); });
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openCmd(); }
  else if ((e.ctrlKey || e.metaKey) && e.key === "Enter" && document.activeElement === $("editor")) { e.preventDefault(); runCurrent(); }
  else if (e.key === "Escape") closeCmd();
});

(async function init() {
  try {
    const cat = await api("/api/operations");
    state.ops = cat.operations; state.modules = cat.modules;
    for (const [mod, title] of Object.entries(cat.modules)) $("bench-module").append(el("option", { value: mod }, title));
    buildNav();
    let saved = null;
    try { saved = localStorage.getItem("arrds.op"); } catch (_) { /* opcional */ }
    selectOp(state.ops.some((o) => o.name === saved) ? saved : "numeric.solve_ivp");
    runBench();  // el indicador de integridad refleja el banco completo al abrir
  } catch (e) {
    setIntegrity("bad", "motor inaccesible");
  }
})();
</script>
</body>
